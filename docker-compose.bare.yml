# Overlay servidor bare (sin Caddy ni Cloudflare): edge propio con TLS automático.
# Uso: docker compose -f docker-compose.yml -f docker-compose.bare.yml up -d --build
# Requiere DOMAIN=<dominio> en .env y puertos 80/443 abiertos + DNS A apuntando.
services:
  edge:
    image: caddy:2-alpine
    container_name: crm-edge
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile.edge:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN requerido en bare}
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
